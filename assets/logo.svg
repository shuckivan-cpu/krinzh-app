<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Moon -->
  <circle cx="90" cy="75" r="40" fill="url(#moonGrad)" filter="url(#glow)"/>
  <circle cx="110" cy="65" r="32" fill="#0F172A"/>
  <!-- Stars -->
  <g fill="url(#starGrad)" filter="url(#glow)">
    <polygon points="140,40 142,46 148,46 143,50 145,56 140,52 135,56 137,50 132,46 138,46"/>
    <polygon points="155,65 156.5,69 161,69 157.5,72 159,76 155,73.5 151,76 152.5,72 149,69 153.5,69" transform="scale(0.8) translate(30,10)"/>
    <polygon points="130,25 131,28 134,28 131.5,30 132.5,33 130,31 127.5,33 128.5,30 126,28 129,28"/>
    <polygon points="160,50 161,52.5 164,52.5 161.5,54.5 162.5,57 160,55.5 157.5,57 158.5,54.5 156,52.5 159,52.5" transform="scale(0.7) translate(70,15)"/>
    <polygon points="115,30 116,33 119,33 116.5,35 117.5,37.5 115,36 112.5,37.5 113.5,35 111,33 114,33" transform="scale(0.6) translate(80,-5)"/>
  </g>
  <!-- Sleeping Z's -->
  <g fill="#94A3B8" font-family="Georgia, serif" font-style="italic" opacity="0.5">
    <text x="145" y="38" font-size="14" transform="rotate(-15,145,38)">z</text>
    <text x="155" y="28" font-size="11" transform="rotate(-10,155,28)">z</text>
    <text x="162" y="20" font-size="8" transform="rotate(-5,162,20)">z</text>
  </g>
  <!-- Wave decoration -->
  <path d="M30,120 Q60,110 90,120 Q120,130 150,120 Q170,113 185,120" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M20,128 Q55,118 90,128 Q125,138 160,128 Q180,121 190,128" stroke="#FBBF24" stroke-width="1.5" fill="none" opacity="0.2"/>
  <!-- Company Name -->
  <text x="100" y="158" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#F59E0B" letter-spacing="1">Кринж &amp; Co</text>
  <text x="100" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8" letter-spacing="2">ЗДОРОВЫЙ СОН</text>
</svg>
